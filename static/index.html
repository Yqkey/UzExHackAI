<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Агент по сделкам биржи · Birja bitimlari agenti</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--ac:#0b5cff;--bd:#e4e7ec}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--card:#181c25;--tx:#e8ebf1;--mut:#98a2b3;--ac:#6b9bff;--bd:#2a3040}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 80px}h1{font-size:22px;margin:8px 0 2px}.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:12px 0}
form{display:flex;gap:8px}input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
button{padding:0 18px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px;cursor:pointer}button:disabled{opacity:.5}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.ex a{font-size:13px;border:1px solid var(--bd);border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--mut)}
.q{font-weight:600}.a{white-space:pre-wrap;margin-top:6px}.meta{color:var(--mut);font-size:13px;margin-top:8px}
details{margin-top:8px}summary{cursor:pointer;color:var(--ac);font-size:14px}pre{overflow:auto;background:var(--bg);padding:10px;border-radius:8px;font-size:12.5px}
</style></head><body><main>
<h1>Агент по сделкам биржи <span style="color:var(--mut)">· Birja bitimlari agenti</span></h1>
<p class="sub">Отвечает только по данным реестра (03.01.2022 – 30.10.2026). Savollar rus yoki o‘zbek tilida.</p>
<form id="f"><input id="q" placeholder="Вопрос / Savol…" autocomplete="off" autofocus><button id="b">→</button></form>
<div class="ex" id="ex"></div><div id="log"></div>
<script>
const ex=["Какой товар принёс наибольшую сумму сделок в 2025 году?","2024-yilda Toshkent shahrida nechta bitim tuzilgan?","Кто топ-3 продавца хлопка-сырца по объёму?","Eng ko‘p bitim qilgan broker qaysi?"];
const exEl=document.getElementById('ex');ex.forEach(t=>{const a=document.createElement('a');a.textContent=t;a.onclick=()=>{q.value=t;f.requestSubmit()};exEl.append(a)});
const log=document.getElementById('log'),f=document.getElementById('f'),q=document.getElementById('q'),b=document.getElementById('b');
f.onsubmit=async e=>{e.preventDefault();const t=q.value.trim();if(!t)return;b.disabled=true;q.value='';
 const c=document.createElement('div');c.className='card';const qq=document.createElement('div');qq.className='q';qq.textContent=t;
 const aa=document.createElement('div');aa.className='a';aa.textContent='…';c.append(qq,aa);log.prepend(c);
 try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:t})});const j=await r.json();
  aa.textContent=j.answer||j.error;const m=document.createElement('div');m.className='meta';m.textContent=(j.elapsed_sec!=null?j.elapsed_sec+' c · ':'')+(j.grounded===false?'⚠ числа не полностью подтверждены':'числа подтверждены запросами');c.append(m);
  if(j.sql&&j.sql.length){const d=document.createElement('details');const s=document.createElement('summary');s.textContent='Основание: SQL ('+j.sql.length+')';const p=document.createElement('pre');p.textContent=j.sql.join('\n\n');d.append(s,p);c.append(d)}
 }catch(err){aa.textContent='Ошибка сети / Tarmoq xatosi'}b.disabled=false;q.focus()};
</script></main></body></html>
